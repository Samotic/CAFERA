name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A new push to the same branch makes the previous run irrelevant.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '20.11.0'

jobs:
  quality:
    name: Typecheck, lint and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      # `shared` compiles to dist and both workspaces import it from there, so
      # nothing else can typecheck until it exists.
      - name: Build shared contracts
        run: npm run build -w @cafera/shared

      - name: Formatting
        run: npm run format:check

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit and integration tests
        run: npm test
        env:
          # mongodb-memory-server spins up a real mongod, so no Atlas
          # credentials are needed and CI can never touch production data.
          NODE_ENV: test

  build:
    name: Production build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci
      - run: npm run build
        env:
          # Placeholder values: the build must not depend on real secrets, and
          # failing here proves it does.
          NEXT_PUBLIC_API_URL: https://api.example.com
          NEXT_PUBLIC_SITE_URL: https://example.com

      - name: Assert no secrets in the client bundle
        run: node scripts/check-bundle-secrets.mjs

  e2e:
    name: Playwright end-to-end
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci
      - run: npm run build -w @cafera/shared

      - name: Install browsers
        run: npx playwright install --with-deps chromium firefox webkit
        working-directory: web

      - name: Run end-to-end and accessibility suites
        run: npm run test:e2e -w web

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: web/playwright-report/
          retention-days: 7

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      # Advisory-level findings should not block a merge; exploitable ones must.
      - run: npm audit --audit-level=high
