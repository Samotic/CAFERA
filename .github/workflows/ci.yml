name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A new push to the same branch makes the previous run irrelevant.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22.x'

jobs:
  # One job, in order, because each step is only meaningful if the previous one
  # passed — there is no point running Playwright against a build that does not
  # typecheck.
  #
  # `typecheck` leads deliberately. A type error reached main once because the
  # pre-commit hook ran prettier and eslint but not tsc, and a hook is bypassable
  # with --no-verify in any case. CI is the copy that cannot be skipped.
  verify:
    name: Typecheck, lint, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Formatting
        run: npm run format:check

      - name: Unit and integration tests
        run: npm test

      - name: Build
        run: npm run build
        env:
          # Placeholder values. The build must not depend on real secrets, and
          # failing here is how we find out that it does.
          MONGODB_URI: mongodb://127.0.0.1:27017/cafera_ci
          NEXT_PUBLIC_SITE_URL: https://example.com

      # Server and client code now share one tree, so an accidental import
      # crosses the boundary silently. This matters more than it did under the
      # workspace split, not less.
      - name: Assert no secrets in the client bundle
        run: npm run scan:secrets

      - name: Install browsers
        run: npx playwright install --with-deps chromium firefox webkit

      - name: End-to-end and accessibility suites
        run: npm run test:e2e
        env:
          MONGODB_URI: mongodb://127.0.0.1:27017/cafera_ci
          NEXT_PUBLIC_SITE_URL: http://127.0.0.1:3100

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      # Advisory findings should not block a merge; exploitable ones must.
      - run: npm audit --audit-level=high
